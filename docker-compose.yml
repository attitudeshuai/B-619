version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: hotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Spring Boot 后端
  backend:
    build: ./backend
    container_name: hotel-backend
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-network

  # Vue 前端
  frontend:
    build: ./frontend
    container_name: hotel-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  mysql_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
